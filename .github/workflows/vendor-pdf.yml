name: Bundle PDF parser locally
on:
  push:
    paths:
      - .github/workflows/vendor-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download pinned Mozilla PDF.js npm package
        run: |
          set -euo pipefail
          mkdir -p vendor .npm-pkg
          npm pack pdfjs-dist@5.7.284 --pack-destination .npm-pkg --silent
          tar -xzf .npm-pkg/pdfjs-dist-5.7.284.tgz -C .npm-pkg
          cp .npm-pkg/package/build/pdf.min.mjs vendor/pdf.min.mjs
          cp .npm-pkg/package/build/pdf.worker.min.mjs vendor/pdf.worker.min.mjs
          cp .npm-pkg/package/LICENSE vendor/LICENSE.pdfjs
      - name: Commit local PDF reader files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/pdf.min.mjs vendor/pdf.worker.min.mjs vendor/LICENSE.pdfjs
          if ! git diff --cached --quiet; then
            git commit -m "Vendor PDF.js for private on-device Sber PDF imports"
            git push origin HEAD:main
          fi
