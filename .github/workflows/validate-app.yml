name: Validate iPhone finance app
on:
  push:
    paths:
      - .github/workflows/validate-app.yml
      - app.js
      - insights.js
      - dashboard.js
      - funds.js
      - funds-ui.js
      - assistant.js
      - assistant-ui.js
      - records.js
      - records-ui.js
      - updates.js
      - import-v14.js
      - tests/**
      - index.html
      - styles.css
      - sw.js
      - vendor/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and local PDF reader
        run: |
          set -euo pipefail
          node --check app.js
          node --check insights.js
          node --check dashboard.js
          node --check funds.js
          node --check funds-ui.js
          node --check assistant.js
          node --check assistant-ui.js
          node --check records.js
          node --check records-ui.js
          node --check updates.js
          node --check import-v14.js
          node --check sw.js
          test -s index.html
          test -s vendor/pdf.min.mjs
          test -s vendor/pdf.worker.min.mjs
          node --check vendor/pdf.min.mjs
          node --check vendor/pdf.worker.min.mjs
          grep -q 'sberPdfFile' index.html
          grep -q 'pdfSberRows' app.js
          grep -q 'vendor/pdf.min.mjs' sw.js
          grep -q 'renderSubscriptions' app.js
          grep -q 'data-tab="subscriptions"' index.html
          node --test tests/*.test.js
          echo "Finance application syntax, subscriptions, and offline PDF assets valid"

