name: Validate iPhone finance app
on:
  push:
    paths:
      - .github/workflows/validate-app.yml
      - app.js
      - sber-import.js
      - index.html
      - sw.js
      - vendor/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and PDF reader
        run: |
          set -euo pipefail
          node --check app.js
          node --check sber-import.js
          node --check sw.js
          test -s index.html
          test -s vendor/pdf.min.mjs
          test -s vendor/pdf.worker.min.mjs
          node --check vendor/pdf.min.mjs
          node --check vendor/pdf.worker.min.mjs
          grep -q 'sber-import.js' index.html
          grep -q 'sber-import.js' sw.js
          echo "Syntax and local-only PDF assets valid"
