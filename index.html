<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#0a1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мои Финансы">
  <meta name="description" content="Личный финансовый кабинет. Локальный учёт расходов, бюджетов и кредитов; сводка и планы для помощника ChatGPT по вашему выбору.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="any" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Мои Финансы</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-lockup"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M7 28l8-9 7 5 11-14" fill="none" stroke="currentColor" stroke-width="3.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M25 10h8v8" fill="none" stroke="currentColor" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="brand-name">МОИ ФИНАНСЫ</div><div class="brand-sub">Ваш личный контроль</div></div></div>
    <button class="top-add" id="topAdd" aria-label="Добавить операцию" title="Новая операция"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <main id="app" class="page-main" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="Разделы">
    <button class="nav-btn active" data-tab="home" type="button" aria-label="Обзор"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span>Обзор</span></button>
    <button class="nav-btn" data-tab="transactions" type="button" aria-label="Операции"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="7" cy="7" r="1"/><circle cx="7" cy="12" r="1"/><circle cx="7" cy="17" r="1"/></svg><span>Операции</span></button>
    <button class="nav-btn" data-tab="budgets" type="button" aria-label="Бюджеты"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M16 14h2"/></svg><span>Бюджеты</span></button>
    <button class="nav-btn" data-tab="debts" type="button" aria-label="Кредиты"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg><span>Кредиты</span></button>
    <button class="nav-btn" data-tab="savings" type="button" aria-label="Вклад"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="13" rx="2"/><path d="M4 12h16M7 8V6c0-2 10-2 10 0v2M8 16h8"/></svg><span>Вклад</span></button>
    <button class="nav-btn" data-tab="subscriptions" type="button" aria-label="Подписки"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-4l2 2M20 15a8 8 0 0 1-14 4l-2-2"/><path d="M20 3v4h-4M4 21v-4h4"/></svg><span>Подписки</span></button>
    <button class="nav-btn" data-tab="settings" type="button" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9L7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Настройки</span></button>
  </nav>
</div>
<div class="modal-backdrop hidden" id="modalBackdrop" role="presentation"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle"></div><div class="sheet-heading"><h2 id="sheetTitle"></h2><button class="icon-btn" id="closeModal" type="button" aria-label="Закрыть">✕</button></div><div class="sheet-body" id="sheetBody"></div></section></div>
<div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
<input id="csvFile" type="file" accept=".csv,.txt,text/csv,text/plain" hidden>
<input id="sberPdfFile" type="file" accept=".pdf,application/pdf" hidden>
<input id="sberDebtPdfFile" type="file" accept=".pdf,application/pdf" hidden>
<input id="backupFile" type="file" accept=".json,.mfinance,application/json" hidden>
<input id="assistantPlanFile" type="file" accept=".json,application/json,text/plain" hidden>
<script src="./import-v14.js" defer></script>
<script src="./insights.js" defer></script>
<script src="./dashboard.js" defer></script>
<script src="./assistant.js" defer></script>
<script src="./assistant-ui.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
